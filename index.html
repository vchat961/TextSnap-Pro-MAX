<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TextSnap Pro MAX | by Vicky Chathar 🇰🇪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0A1128;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        body.light-mode {
            background: #f5f7fa;
        }
        body.light-mode .app-container { background: #FFFFFF; }
        body.light-mode .grid-card { background: #F0F2F5; border-color: #ddd; }
        body.light-mode .grid-title { color: #333; }
        body.light-mode .text-panel { background: #F0F2F5; }
        body.light-mode .extracted-text { color: #333; }
        body.light-mode .task-item { background: #F0F2F5; }
        body.light-mode .task-title { color: #333; }
        body.light-mode .howto-section { background: #F0F2F5; }
        body.light-mode .howto-step { color: #555; }
        body.light-mode .service-card { background: #F0F2F5; }
        body.light-mode .service-name { color: #555; }
        body.light-mode .plan-card { background: #F0F2F5; }

        .app-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: #0A1128;
            border-radius: 24px;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .app-header {
            padding: 20px 24px 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(0, 180, 216, 0.2);
        }
        .logo-area { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo-icon { font-size: 28px; color: #00B4D8; }
        .app-title { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #00B4D8, #00F5FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .creator-credit { font-size: 11px; color: #6C8DB0; }
        .item-count { font-size: 12px; background: rgba(0, 180, 216, 0.2); color: #00B4D8; padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(0, 180, 216, 0.3); }

        .theme-toggle {
            background: rgba(0, 180, 216, 0.15);
            border: none;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 12px;
            color: #00B4D8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scroll-content { padding: 20px 24px 24px 24px; }

        .upload-area {
            border: 2px dashed rgba(0, 180, 216, 0.4);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(0, 0, 0, 0.2);
            margin-bottom: 24px;
        }
        .upload-area:hover { border-color: #00B4D8; background: rgba(0, 180, 216, 0.05); }

        .search-bar { margin-bottom: 20px; }
        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 40px;
            padding: 12px 18px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .search-input::placeholder { color: #6C8DB0; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
            padding: 4px 2px;
            margin-bottom: 24px;
            scroll-behavior: smooth;
        }
        .grid-card {
            background: rgba(13, 27, 62, 0.6);
            border: 1px solid rgba(0, 180, 216, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            transition: all 0.2s;
            padding: 6px 8px;
            gap: 7px;
            position: relative;
        }
        .grid-card:hover { background: rgba(0, 180, 216, 0.1); border-color: #00B4D8; }
        .grid-card.active { border-color: #FFB800; background: rgba(255, 184, 0, 0.1); }
        .grid-icon { font-size: 14px; color: #00B4D8; flex-shrink: 0; }
        .grid-title { font-size: 10px; font-weight: 500; color: #B0C4DE; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

        .text-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 180, 216, 0.2);
        }
        .text-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 12px; }
        .text-panel-title { font-size: 13px; font-weight: 600; color: #6C8DB0; text-transform: uppercase; }
        .text-panel-actions { display: flex; gap: 10px; }
        .action-btn {
            background: rgba(0, 180, 216, 0.15);
            border: none;
            padding: 6px 14px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 500;
            color: #00B4D8;
            cursor: pointer;
        }
        .action-btn:hover { background: #00B4D8; color: #0A1128; }
        .extracted-text {
            font-size: 14px;
            color: #E0E0E0;
            line-height: 1.6;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
        }

        .notes-tags-area { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        .notes-input, .tags-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 30px;
            padding: 10px 14px;
            color: white;
            font-size: 12px;
        }

        .main-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 28px; }
        .main-btn {
            height: 44px;
            padding: 0 8px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            white-space: nowrap;
        }
        .btn-copy { background: #00E676; color: #0A1128; border: none; }
        .btn-pdf { background: #FF6D00; color: white; border: none; }
        .btn-task { background: #00B4D8; color: #0A1128; border: none; }
        .btn-export { background: #9C27B0; color: white; border: none; }

        .tasks-section { margin-bottom: 28px; }
        .section-title { font-size: 14px; font-weight: 600; color: #6C8DB0; text-transform: uppercase; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .task-list { max-height: 300px; overflow-y: auto; }
        .task-item {
            background: rgba(13, 27, 62, 0.6);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 4px solid;
        }
        .task-critical { border-left-color: #FF3B30; }
        .task-normal { border-left-color: #FFB800; }
        .task-less { border-left-color: #00E676; }
        .task-title { font-size: 15px; font-weight: 600; color: white; }
        .task-details { font-size: 11px; color: #6C8DB0; margin-top: 6px; }
        .task-tags { font-size: 10px; color: #FF6D00; margin-top: 5px; }
        .task-notes { font-size: 10px; color: #6C8DB0; margin-top: 5px; font-style: italic; }
        .task-actions { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .task-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            color: #B0C4DE;
        }
        .task-btn:hover { background: rgba(0, 180, 216, 0.3); }

        .howto-section {
            background: rgba(0, 180, 216, 0.05);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 180, 216, 0.15);
        }
        .howto-title { font-size: 13px; font-weight: 600; color: #00B4D8; margin-bottom: 12px; }
        .howto-step { font-size: 12px; color: #B0C4DE; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .howto-step i { width: 20px; font-size: 12px; color: #00B4D8; }

        .services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
        .service-card {
            background: rgba(13, 27, 62, 0.6);
            border: 1px solid rgba(0, 180, 216, 0.2);
            border-radius: 14px;
            padding: 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 72px;
        }
        .service-card:hover { background: rgba(0, 180, 216, 0.15); transform: translateY(-2px); border-color: #00B4D8; }
        .service-icon { font-size: 20px; color: #00B4D8; display: block; }
        .service-name { font-size: 9px; color: #B0C4DE; }

        /* Plans Section - Simplified (Free + Buy Me a Coffee) */
        .plans-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .plan-card {
            background: rgba(13, 27, 62, 0.6);
            border: 1px solid rgba(0, 180, 216, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: all 0.2s;
        }
        .plan-card.active-plan { border-color: #00E676; background: rgba(0, 230, 118, 0.05); }
        .plan-name { font-size: 18px; font-weight: 700; color: white; margin-bottom: 8px; }
        .plan-price { font-size: 24px; font-weight: 700; color: #00B4D8; margin-bottom: 8px; }
        .plan-extractions { font-size: 12px; color: #B0C4DE; margin-bottom: 8px; }
        .plan-btn {
            width: 100%;
            padding: 10px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            text-decoration: none;
            display: block;
        }
        .plan-btn-active { background: #00E676; color: #0A1128; border: none; }
        .plan-btn-paid { background: #FFB800; color: #0A1128; border: none; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0D1B3E;
            border-radius: 28px;
            padding: 24px;
            width: 90%;
            max-width: 450px;
            border: 1px solid #00B4D8;
        }
        .modal-content h3 { color: #00B4D8; margin-bottom: 20px; font-size: 20px; }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border-radius: 30px;
            border: 1px solid #00B4D8;
            background: #0A1128;
            color: white;
            font-size: 14px;
        }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-save { background: #00E676; color: #0A1128; border: none; }
        .btn-cancel { background: #FF3B30; color: white; border: none; }

        .status-text { font-size: 13px; color: #00B4D8; text-align: center; margin: 16px 0; }

        footer {
            padding: 20px 24px;
            text-align: center;
            font-size: 11px;
            color: #4A6A8A;
            border-top: 1px solid rgba(0, 180, 216, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        #toastContainer { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #0D1B3E; border: 1px solid #00B4D8; border-radius: 14px; padding: 12px 18px; font-size: 13px; color: white; display: flex; align-items: center; gap: 10px; min-width: 260px; animation: slideIn 0.3s ease; }
        .toast.error { border-color: #FF3B30; }
        .toast.success { border-color: #00E676; }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10,17,40,0.97);
            backdrop-filter: blur(10px);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #0D1B3E;
            border: 1px solid rgba(0,180,216,0.3);
            border-radius: 28px;
            padding: 36px 28px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo { font-size: 48px; color: #00B4D8; margin-bottom: 12px; }
        .login-title { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #00B4D8, #00F5FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .login-sub { font-size: 13px; color: #6C8DB0; margin-bottom: 24px; }
        .login-input { width: 100%; padding: 14px; border-radius: 30px; border: 1px solid #00B4D8; background: #0A1128; color: white; font-size: 14px; margin-bottom: 15px; }
        .login-btn { width: 100%; padding: 14px; background: #00B4D8; color: #0A1128; border: none; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .privacy-check { display: flex; align-items: center; gap: 10px; margin: 15px 0; font-size: 11px; color: #6C8DB0; }
        .privacy-check a { color: #00B4D8; cursor: pointer; }
        .free-badge { font-size: 11px; color: #00E676; margin-top: 10px; }

        #profileSection { display: none; }
        .profile-card {
            background: rgba(13,27,62,0.6);
            border: 1px solid rgba(0,180,216,0.2);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 24px;
        }
        .profile-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
        .profile-avatar-placeholder { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #00B4D8; background: rgba(0,180,216,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #00B4D8; }
        .profile-name { font-size: 16px; font-weight: 700; color: white; }
        .profile-email { font-size: 11px; color: #6C8DB0; margin-top: 2px; }
        .profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stat-box { background: rgba(0,180,216,0.08); border-radius: 12px; padding: 12px; text-align: center; }
        .stat-num { font-size: 22px; font-weight: 700; color: #00B4D8; }
        .stat-label { font-size: 10px; color: #6C8DB0; }
    </style>
</head>
<body>

<div id="toastContainer"></div>

<!-- Login Overlay -->
<div id="loginOverlay">
    <div class="login-box">
        <div class="login-logo"><i class="fas fa-camera-retro"></i></div>
        <div class="login-title">TextSnap Pro MAX</div>
        <div class="login-sub">by Vicky Chathar 🇰🇪</div>
        <input type="text" id="guestUsername" class="login-input" placeholder="Enter your name">
        <button id="guestLoginBtn" class="login-btn">Continue →</button>
        <div class="privacy-check">
            <input type="checkbox" id="privacyAgree">
            <label>I agree to the <a onclick="alert('Privacy Policy: Your data is stored locally on your device. No data is shared with third parties.')">Privacy Policy</a></label>
        </div>
        <div class="free-badge">✨ Free plan includes 8 extractions/day</div>
    </div>
</div>

<div class="app-container">
    <div class="app-header">
        <div class="logo-area">
            <i class="fas fa-camera-retro logo-icon"></i>
            <span class="app-title">TextSnap</span>
            <span class="creator-credit">by Vicky Chathar 🇰🇪</span>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button id="themeToggleBtn" class="theme-toggle"><i class="fas fa-moon"></i> <span id="themeText">Dark</span></button>
            <div class="item-count" id="itemCount">0 items</div>
            <button id="headerProfileBtn" onclick="toggleProfileSection()" style="background:rgba(0,180,216,0.15);border:none;padding:8px 12px;border-radius:30px;color:#00B4D8;cursor:pointer;font-size:12px;display:none;"><i class="fas fa-user"></i></button>
        </div>
    </div>

    <div class="scroll-content">
        <!-- Profile Section -->
        <div id="profileSection">
            <div class="profile-card">
                <div class="profile-top">
                    <div class="profile-avatar-placeholder" id="profileAvatar"><i class="fas fa-user"></i></div>
                    <div>
                        <div class="profile-name" id="profileName">Guest User</div>
                        <div class="profile-email" id="profileEmail">Not signed in</div>
                    </div>
                    <button onclick="signOut()" style="margin-left:auto; background:rgba(255,59,48,0.15); border:1px solid #FF3B30; color:#FF3B30; border-radius:20px; padding:6px 12px; font-size:11px; cursor:pointer;">Sign Out</button>
                </div>
                <div class="profile-stats">
                    <div class="stat-box"><div class="stat-num" id="statExtractions">0</div><div class="stat-label">Extractions</div></div>
                    <div class="stat-box"><div class="stat-num" id="statTasks">0</div><div class="stat-label">Tasks</div></div>
                    <div class="stat-box"><div class="stat-num" id="statCopied">0</div><div class="stat-label">Copied</div></div>
                </div>
            </div>
        </div>

        <div class="upload-area" id="uploadArea">
            <i class="fas fa-cloud-upload-alt" style="font-size: 28px; color: #00B4D8;"></i>
            <p style="font-size: 14px; margin-top: 10px;">📤 Upload Images</p>
            <p style="font-size: 11px; color: #6C8DB0;">or drag & drop (JPG, PNG)</p>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>

        <div class="search-bar">
            <input ty
